# Publica o guifav.dev no GitHub Pages: site atual (HTML à mão) mais o blog Astro em /blog/.
# Épico #16, issue #17. Requer Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Só execuções que publicam (push ou disparo manual na main) entram no grupo de deploy, em fila e
  # nunca canceladas no meio. PRs e disparos em outras branches têm grupo próprio e cancelam o anterior.
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'pages-deploy' || format('pages-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o lastmod do /sitemap-site.xml vem do último commit de cada página.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: blog-src/.nvmrc
          cache: npm
          cache-dependency-path: blog-src/package-lock.json

      - name: Instalar dependências do blog
        working-directory: blog-src
        run: npm ci

      - name: Testes do blog
        working-directory: blog-src
        run: npm test

      - name: Testes do Worker da newsletter
        working-directory: workers/newsletter
        run: npm test

      - name: Testes do Worker do painel de assinantes
        working-directory: workers/admin
        run: npm test

      - name: Build do blog
        working-directory: blog-src
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Testes dos scripts de montagem
        run: |
          python3 scripts/test_assemble_site.py
          python3 scripts/test_check_site.py
          python3 scripts/test_cutover_redirects.py
          python3 scripts/test_build_sitemaps.py
          python3 scripts/test_indexnow.py
          python3 blog-src/scripts/test_newsletter_draft.py
          python3 blog-src/scripts/test_import_subscribers.py
          python3 blog-src/scripts/test_twenty_sync.py

      - name: Montar _site (manifesto + blog) e verificar byte a byte
        run: python3 scripts/assemble_site.py

      - name: Gerar o índice /sitemap.xml e o /sitemap-site.xml
        run: python3 scripts/build_sitemaps.py

      - name: Verificar links, noindex, RSS e sitemaps
        run: python3 scripts/check_site.py

      - name: Plano do IndexNow (URLs que mudaram em relação ao site publicado)
        id: indexnow
        # Opcional: se falhar, o deploy segue; o job indexnow fica vermelho por falta do plano.
        continue-on-error: true
        run: python3 scripts/indexnow.py diff --out "$RUNNER_TEMP/indexnow/plan.json"

      - name: Guardar o plano do IndexNow para o job seguinte
        if: steps.indexnow.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-plan
          path: ${{ runner.temp }}/indexnow/plan.json
          retention-days: 7
          if-no-files-found: error

      - name: Publicar artefato do Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Depois do deploy, avisa os buscadores do IndexNow (Bing e outros) sobre as URLs do plano.
    # Falha aqui não desfaz o deploy; aparece em vermelho para olhar.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/indexnow.py
            scripts/build_sitemaps.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: indexnow-plan
          path: ${{ runner.temp }}/indexnow

      - name: Avisar o IndexNow
        run: python3 scripts/indexnow.py submit --plan "$RUNNER_TEMP/indexnow/plan.json"
