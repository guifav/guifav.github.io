# Worker de inscrição da newsletter do blog (issue #21). O deploy é manual, depois do merge: ver README.md.
#
# Segredos: só via `wrangler secret put`, nunca neste arquivo.
#   RESEND_API_KEY    chave do Resend com full_access (cria contatos)
#   TURNSTILE_SECRET  chave secreta do widget do Turnstile de guifav.dev
#   CONFIRM_SECRET    32 caracteres ou mais; assina o link de confirmação (openssl rand -base64 48)
name = "blog-newsletter"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "insights.guifav.dev", custom_domain = true }]

[vars]
FROM = "Guilherme Favaron | Expert Insights <insights@guifav.dev>"
REPLY_TO = "contact@guifav.dev"
# Segmento "IA Aplicada" do Resend (criado em 2026-11-11). Vazio: o Worker responde 500 e não cadastra nada.
SEGMENT_ID = "34c37605-670a-4c09-9dff-5e5a05c9e0fa"
# Tópico "IA Aplicada" do Resend (criado em 2026-11-12, privado, opt_in por padrão): o descadastro da newsletter
# vale só para ele, não para todos os broadcasts da conta. Vazio: o Worker responde 500 e não cadastra nada.
TOPIC_ID = "77f2a0b8-16aa-4ac6-9840-c352559edb51"
SITE_ORIGIN = "https://guifav.dev"
BLOG_URL = "https://guifav.dev/blog"
WORKER_URL = "https://insights.guifav.dev"
TURNSTILE_HOSTNAME = "guifav.dev"

# Garantia A6: cerca de 5 pedidos por IP e 1 email de confirmação por endereço, a cada 60 s. O rate limit
# do Workers é aproximado e conta separado em cada localidade do Cloudflare: contém abuso junto com o
# Turnstile, mas não é um teto global garantido.
[[ratelimits]]
name = "RL_IP"
namespace_id = "2101"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_EMAIL"
namespace_id = "2102"
simple = { limit = 1, period = 60 }
